name: Gerar APK Olho do Ceu
on:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Criar App Olho do Ceu
        run: |
          mkdir www
          echo '<h1>Olho do Ceu - Matola Sky funcionando!</h1>' > www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "OlhoDoCeu" "com.matola.olhodoceu" --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: OlhoDoCeu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
